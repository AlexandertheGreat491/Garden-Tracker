<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Grove | Garden Tracker</title>
<!--Connect CSS-->
<link rel="stylesheet" href="styles.css">
<!--Connect JavaScript-->
<script src+"script.js" defer></script>
<body>
<header>
  <h1>🌿 Garden Grove</h1>
  <p>Your personal garden tracker</p>
</header>
<main>
 <div class="hero">
<h2>Grow something wonderful 🌱</h2>
<p>
Track your plants, raised beds, watering, and harvests.    
</p>
 </div>
 <!--Dashboard statistics-->   
 <div class="stats">
<span>Plants tracked</span>
<strong id="plantCount">0</strong>
 </div>
 <div class="stat">
<span>Need watering</span>
<strong id="waterCount">0</strong>
 </div>
 <div class="stat">
      <span>Harvest records</span>
      <strong id="harvestCount">0</strong>
    </div>
 <div class="stat">
      <span>Journal entries</span>
      <strong id="noteCount">0</strong>
    </div>
  </div>

  <!-- Navigation -->
<nav>
    <button class="active" data-tab="dashboard">
      Dashboard
    </button>

    <button data-tab="plants">
      My Plants
    </button>

    <button data-tab="planner">
      🪴 Bed Planner
    </button>

    <button data-tab="harvests">
      Harvests
    </button>

    <button data-tab="journal">
      Journal
    </button>
  </nav>
  <!-- Dashboard -->
 <section id="dashboard" class="section active">
 <div class="panel">
<h2>💧 Watering reminders</h2>
      <div id="dueList"></div>
 </div> 
 </section>  
</main>
</body>
</head>    
</html>
