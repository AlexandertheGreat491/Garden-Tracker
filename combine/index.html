<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Garden Grove | Garden Tracker</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
<header>
<h1>🌿 Garden Grove</h1>
    <p>Your personal garden tracker and planner</p>
</header>
<main>
<div class="hero">
<h2>Grow something wonderful 🌱</h2>
<p>
Track your plants, plan raised beds, manage water, and record harvests.
</p>
</div>
 <!-- Dashboard statistics -->
<div class="stats">
<div class="stat">
<span>Plants tracked</span>
<strong id="plantCount">0</strong>
</div>
<div class="stat">
        <span>Need watering</span>
        <strong id="waterCount">0</strong>
      </div>

      <div class="stat">
        <span>Harvest records</span>
        <strong id="harvestCount">0</strong>
      </div>

      <div class="stat">
        <span>Journal entries</span>
        <strong id="noteCount">0</strong>
</div>
</div>

  <!-- Navigation -->


</main>
</body>
